<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remote Job Nepal — Get the App</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 380px;
    width: 100%;
  }
  .logo {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-weight: 800;
    font-size: 22px;
    color: #0f172a;
  }
  h1 {
    font-size: 20px;
    margin-bottom: 8px;
    color: #fff;
  }
  p {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 28px;
  }
  .spinner {
    width: 26px;
    height: 26px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: #fff;
    border-radius: 50%;
    margin: 0 auto 24px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 20px;
    margin: 10px 0;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    transition: opacity 0.15s;
  }
  .btn:active { opacity: 0.8; }
  .android { background: #fff; color: #0f172a; }
  .ios { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
  .footer {
    margin-top: 28px;
    font-size: 12px;
    color: #475569;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">RJN</div>
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Taking you to the app</h1>
    <p id="msg">Detecting your device...</p>

    <a class="btn android" id="androidBtn" href="https://play.google.com/store/apps/details?id=com.kp.remotejobnepal">Get it on Google Play</a>
    <a class="btn ios" id="iosBtn" href="https://apps.apple.com/np/app/remote-job-nepal/id6760401983">Download on the App Store</a>

    <div class="footer">Remote Job Nepal</div>
  </div>

  <script>
    var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.kp.remotejobnepal";
    var APP_STORE_URL = "https://apps.apple.com/np/app/remote-job-nepal/id6760401983";

    var ua = navigator.userAgent || navigator.vendor || window.opera;

    function isAndroid() { return /android/i.test(ua); }
    function isiOS() { return /iPad|iPhone|iPod/.test(ua) && !window.MSStream; }

    document.getElementById("androidBtn").href = PLAY_STORE_URL;
    document.getElementById("iosBtn").href = APP_STORE_URL;

    if (isAndroid()) {
      document.getElementById("msg").textContent = "Redirecting to Google Play...";
      window.location.replace(PLAY_STORE_URL);
    } else if (isiOS()) {
      document.getElementById("msg").textContent = "Redirecting to the App Store...";
      window.location.replace(APP_STORE_URL);
    } else {
      document.getElementById("spinner").style.display = "none";
      document.getElementById("title").textContent = "Get Remote Job Nepal";
      document.getElementById("msg").textContent = "Choose your platform:";
    }
  </script>
</body>
</html>
